services:
  db:
    image: postgres:16-alpine
    container_name: registration-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_registration_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_72}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-course_registration_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: registration-backend:latest
    container_name: registration-backend
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_registration_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_72}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database-network
      - frontend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: registration-frontend:latest
    container_name: registration-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8072}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
    depends_on:
      - backend
    networks:
      - frontend-network

volumes:
  postgres_data:
    name: registration_postgres_data

networks:
  frontend-network:
    name: registration_frontend_network
    driver: bridge
  database-network:
    name: registration_database_network
    driver: bridge
